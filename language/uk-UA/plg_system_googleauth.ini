PLG_SYSTEM_GOOGLEAUTH_BUTTON_TYPE_DESC="«Логотип з написом» показує логотип Google і текст входу. «Лише значок» показує тільки логотип Google всередині кнопки (текст залишається у спливній підказці та для скрінрідерів)."
