PLG_SYSTEM_GOOGLEAUTH_BUTTON_SHAPE_RECTANGULAR="Прямокутна (більш квадратна)"
PLG_SYSTEM_GOOGLEAUTH_BUTTON_SHAPE_PILL="Заокруглена"
PLG_SYSTEM_GOOGLEAUTH_MATCH_SUBMIT_LABEL="Копіювати стиль і ховер з кнопки входу форми (submit)"
PLG_SYSTEM_GOOGLEAUTH_MATCH_SUBMIT_DESC="Копіює CSS-класи кнопки «Увійти» з форми на кнопку Google, тож вона виглядає і реагує на наведення так само, як рідна кнопка шаблону. Поки увімкнено, колірна схема та форма кнопки ігноруються. Важливо: гайд Google вимагає кольоровий логотип Google на світлому, темному або нейтральному тлі, і в цьому режимі це може не дотримуватися."
